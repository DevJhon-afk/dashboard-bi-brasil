name: Coletar vagas (Adzuna)

on:
  schedule:
    - cron: "0 9 * * *"   # todo dia ~06:00 BRT
  workflow_dispatch: {}    # permite rodar na mão pelo botão "Run workflow"

permissions:
  contents: write

concurrency:
  group: coletar-vagas
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Coletar snapshot do mercado
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
        run: python scripts/coletar_vagas.py

      - name: Commitar se mudou
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- data/vagas_mercado.csv; then
            echo "Sem mudanças no CSV — nada a commitar."
          else
            git add data/vagas_mercado.csv
            git commit -m "Vagas: snapshot diário do mercado (Adzuna) [skip ci]"
            git push
          fi
